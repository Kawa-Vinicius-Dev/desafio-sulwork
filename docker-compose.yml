services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sulwork
      POSTGRES_USER: sulwork
      POSTGRES_PASSWORD: sulwork
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulwork -d sulwork"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/sulwork
      DB_USER: sulwork
      DB_PASSWORD: sulwork
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
