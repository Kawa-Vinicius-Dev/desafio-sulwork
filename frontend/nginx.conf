server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Chamadas da API vão para o container do backend (nome do serviço no compose)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Rotas do React (/eventos/1, /participantes...) sempre devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
